{% extends "base.html" %}
{% block content %}

<div style="max-width:680px; margin:0 auto">

  <div class="mb-4">
    <a href="/" style="color:#666; font-size:13px; text-decoration:none">← Back to Dashboard</a>
    <h4 class="fw-bold mt-3 mb-1" style="color:#e8e8f5">Add New Lead</h4>
    <p style="color:#666; font-size:13px">Claude uses these details to personalise outreach messages.</p>
  </div>

  <div class="hn-card p-4">
    <form method="POST" action="/leads/add">

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="hn-label">Full Name <span style="color:#f87171">*</span></label>
          <input type="text" name="name" required placeholder="Sarah Mitchell" class="form-control hn-input"/>
        </div>
        <div class="col-md-6">
          <label class="hn-label">Company</label>
          <input type="text" name="company" placeholder="CloudStack Pro" class="form-control hn-input"/>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="hn-label">Role / Title</label>
          <input type="text" name="role" placeholder="VP Sales" class="form-control hn-input"/>
        </div>
        <div class="col-md-6">
          <label class="hn-label">Industry</label>
          <input type="text" name="industry" placeholder="SaaS" class="form-control hn-input"/>
        </div>
      </div>

      <hr style="border-color:rgba(255,255,255,0.06); margin:20px 0"/>
      <p style="font-size:11px; color:#555; text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:16px">Contact Channels</p>

      <div class="mb-3">
        <label class="hn-label">📧 Email Address</label>
        <input type="email" name="email" placeholder="sarah@cloudstackpro.com" class="form-control hn-input"/>
      </div>

      <div class="mb-3">
        <label class="hn-label">💬 WhatsApp Number</label>
        <input type="text" name="whatsapp" placeholder="+919876543210" class="form-control hn-input"/>
        <div style="color:#555; font-size:12px; margin-top:5px">Include country code — India: +91, US: +1, Germany: +49</div>
      </div>

      <div class="mb-4">
        <label class="hn-label">Notes <span style="color:#555; font-weight:400">(optional)</span></label>
        <textarea name="notes" rows="3"
                  placeholder="e.g. Just raised Series A, hiring 3 new SDRs, posted about pipeline issues last week..."
                  class="form-control hn-input" style="resize:none"></textarea>
        <div style="color:#555; font-size:12px; margin-top:5px">Claude uses notes to personalise each message.</div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <button type="submit" class="hn-btn">Save Lead</button>
        <a href="/" style="color:#666; font-size:13px; text-decoration:none">Cancel</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
